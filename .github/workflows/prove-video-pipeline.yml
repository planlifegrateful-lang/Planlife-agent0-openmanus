name: Prove Video Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'video-builder/**'
      - '.github/workflows/prove-video-pipeline.yml'

permissions:
  contents: read

jobs:
  build-proof-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python3 -m pip install --upgrade pip
          python3 -m pip install flask pillow requests

      - name: Start video builder
        working-directory: video-builder
        env:
          PORT: '8001'
          OUTPUT_DIR: ${{ github.workspace }}/output
          WORK_DIR: ${{ runner.temp }}/plg-video-work
          TTS_ENGINE: espeak
        run: |
          nohup python3 app.py > /tmp/video-builder.log 2>&1 &
          echo $! > /tmp/video-builder.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/video-builder.log
          exit 1

      - name: Build real MP4
        env:
          TITLE: Nobody Sees the Work
          SCRIPT: Keep doing the right work when nobody is watching. Make one useful thing with what you have. Stay patient, show gratitude, and take the next honest step. Consistency is built one day at a time.
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'title': os.environ['TITLE'],
              'script': os.environ['SCRIPT']
          }).encode()
          req = urllib.request.Request(
              'http://127.0.0.1:8001/build',
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req, timeout=240) as response:
              result = json.load(response)
          print(json.dumps(result, indent=2))
          if result.get('status') != 'ok':
              raise SystemExit('Video builder did not return status=ok')
          if not result.get('size_bytes', 0) > 5000:
              raise SystemExit('MP4 is missing or too small')
          if not result.get('filename', '').endswith('.mp4'):
              raise SystemExit('Builder did not return an MP4 filename')
          PY

      - name: Validate MP4 streams, dimensions, duration, and size
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess
          files = glob.glob('output/*.mp4')
          if len(files) != 1:
              raise SystemExit(f'Expected exactly one MP4, found {len(files)}')
          path = files[0]
          size = os.path.getsize(path)
          if size <= 5000:
              raise SystemExit(f'MP4 too small: {size} bytes')
          raw = subprocess.check_output([
              'ffprobe', '-v', 'error', '-show_streams', '-show_format',
              '-of', 'json', path
          ], text=True)
          probe = json.loads(raw)
          streams = probe.get('streams', [])
          video = [s for s in streams if s.get('codec_type') == 'video']
          audio = [s for s in streams if s.get('codec_type') == 'audio']
          if not video:
              raise SystemExit('No video stream found')
          if not audio:
              raise SystemExit('No audio stream found')
          width, height = video[0].get('width'), video[0].get('height')
          if (width, height) != (1080, 1920):
              raise SystemExit(f'Unexpected dimensions: {width}x{height}')
          duration = float(probe.get('format', {}).get('duration', 0))
          if duration < 3:
              raise SystemExit(f'Video duration too short: {duration}s')
          print(json.dumps({
              'status': 'PASS',
              'file': os.path.basename(path),
              'size_bytes': size,
              'duration_seconds': round(duration, 2),
              'dimensions': f'{width}x{height}',
              'video_codec': video[0].get('codec_name'),
              'audio_codec': audio[0].get('codec_name'),
              'video_stream': 'PASS',
              'audio_stream': 'PASS'
          }, indent=2))
          PY

      - name: Upload proof video
        uses: actions/upload-artifact@v4
        with:
          name: plg-proof-video-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Publish proof summary
        run: |
          echo "## Plan Life Grateful video pipeline proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- MP4 generated: YES (verified in prior step)" >> "$GITHUB_STEP_SUMMARY"
          echo "- TTS engine: espeak-ng (local, no API key)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rendering: Pillow + FFmpeg" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checks: MP4 size, duration, 1080x1920 dimensions, video stream, audio stream" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: plg-proof-video-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
